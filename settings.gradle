pluginManagement {
    // 原先这里钉了 com.android.tools:r8:9.1.29 与 r8-releases 仓库，
    // 原因是「Kotlin 2.4 metadata requires R8 9.1.29 or newer」，而当时 AGP 自带的 R8 更旧。
    // AGP 升到 9.1.1 后自带 R8 9.1.31（>= 9.1.29），该钉版变成了一次**降级**，
    // 并触发 "project includes version 9.1.29 of R8, while AGP was shipped with 9.1.31" 警告。
    // 因此改为直接使用 AGP 自带的 R8。
    repositories {
        google {
            content {
                includeGroupByRegex("com\\.android.*")
                includeGroupByRegex("com\\.google.*")
                includeGroupByRegex("androidx.*")
            }
        }
        //原仓库
        gradlePluginPortal()
        mavenCentral()
        //镜像仓库,无法连接源仓库自行启用镜像仓库,不要提交修改
        //maven { url "https://maven-central-asia.storage-download.googleapis.com/maven2/" }
        //maven { url 'https://maven.aliyun.com/repository/google' }
        //maven { url 'https://maven.aliyun.com/repository/public' }
        //maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }
        //maven { url 'https://repo.huaweicloud.com/repository/maven/' }
    }
}
plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        maven {
            url = uri("$rootDir/third_party/maven")
            content {
                includeModule("org.htmlunit", "htmlunit-core-js")
            }
        }
        //原仓库
        google {
            content {
                includeGroupByRegex("com\\.android.*")
                includeGroupByRegex("com\\.google.*")
                includeGroupByRegex("androidx.*")
            }
        }
        maven {
            url = 'https://jitpack.io'
            content {
                includeGroupByRegex("com\\.github.*")
            }
        }
        mavenCentral()

        //镜像仓库,无法连接源仓库自行启用镜像仓库,不要提交修改
        //maven { url "https://maven-central-asia.storage-download.googleapis.com/maven2/" }
        //maven { url 'https://maven.aliyun.com/repository/google' }
        //maven { url 'https://maven.aliyun.com/repository/public' }
        //maven { url 'https://repo.huaweicloud.com/repository/maven/' }
    }
}
rootProject.name = 'legado'

include ':app'
include ':modules:book'
include ':modules:rhino'
