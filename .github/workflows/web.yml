name: Build Web

on:
  push:
    branches:
      - master
    paths:
      - 'modules/web/**'
      - '.github/workflows/web.yml'
      - '.github/scripts/push-web-assets.sh'
  pull_request:
    paths:
      - 'modules/web/**'
      - '.github/workflows/web.yml'
      - '.github/scripts/push-web-assets.sh'
  workflow_dispatch:

concurrency:
  group: build-web-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  pull-requests: write
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6.1.0
        name: Install pnpm
        with:
          version: 9.15.9
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: modules/web/pnpm-lock.yaml

      - name: Build and move files
        working-directory: modules/web
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          version="v$(date -d "8 hour" -u +3.%y.%m%d%H)"
          echo "APP_VER=$version" >> $GITHUB_ENV

      - name: Upload web assets
        uses: actions/upload-artifact@v7.0.1
        with:
          name: web-assets
          path: |
            app/src/main/assets/web/vue/
            modules/web/src/components.d.ts
          if-no-files-found: error

      - name: Verify web asset PR credentials
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' && vars.ENABLE_WEB_ASSET_PR == 'true' }}
        env:
          WEB_ASSET_TOKEN: ${{ secrets.WEB_ASSET_TOKEN }}
        run: |
          if [[ -z "$WEB_ASSET_TOKEN" ]]; then
            echo "WEB_ASSET_TOKEN is required to trigger CI on generated asset PRs"
            exit 1
          fi

      - name: Create web asset pull request
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' && vars.ENABLE_WEB_ASSET_PR == 'true' }}
        uses: peter-evans/create-pull-request@v8.1.1
        with:
          token: ${{ secrets.WEB_ASSET_TOKEN }}
          branch: codex/web-assets
          base: master
          title: 'build(web): update bundled web assets'
          commit-message: 'build(web): update bundled web assets'
          body: '更新 Web 构建产物。此 PR 必须通过统一 CI 检查后才能合并。'
          add-paths: |
            app/src/main/assets/web/vue/
            modules/web/src/components.d.ts
