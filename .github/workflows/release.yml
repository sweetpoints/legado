name: Release Build

on:
#  push:
#    branches:
#      - master
#    paths:
#      - 'CHANGELOG.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    outputs:
      version: ${{ steps.set-ver.outputs.version }}
      sign: ${{ steps.check.outputs.sign }}
    steps:
      - id: set-ver
        run: |
          echo "version=$(date -d "8 hour" -u +3.%y.%m%d%H)" >> $GITHUB_OUTPUT
      - id: check
        run: |
          if [ ! -z "${{ secrets.RELEASE_KEY_STORE }}" ]; then
            echo "sign=yes" >> $GITHUB_OUTPUT
          fi

  build:
    needs: prepare
    if: ${{ needs.prepare.outputs.sign }}
    permissions:
      contents: write
    strategy:
      matrix:
        product: [ app ]
      fail-fast: false
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      product: ${{ matrix.product }}
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Android build
        uses: ./.github/actions/setup-android

      - name: Release Apk Sign
        run: |
          # not use this output
          # echo "KeyStore=yes" >> $GITHUB_OUTPUT
          echo -e "\n" >> gradle.properties
          echo RELEASE_KEY_ALIAS='${{ secrets.RELEASE_KEY_ALIAS }}' >> gradle.properties
          echo RELEASE_KEY_PASSWORD='${{ secrets.RELEASE_KEY_PASSWORD }}' >> gradle.properties
          echo RELEASE_STORE_PASSWORD='${{ secrets.RELEASE_STORE_PASSWORD }}' >> gradle.properties
          echo RELEASE_STORE_FILE='./key.jks' >> gradle.properties
          echo ${{ secrets.RELEASE_KEY_STORE }} | base64 --decode > $GITHUB_WORKSPACE/app/key.jks

      - name: Unify Version Name
        run: |
          echo "统一版本号"
          sed "/^val appVersion =/c val appVersion = \"${{ env.VERSION }}\"" $GITHUB_WORKSPACE/app/build.gradle.kts  -i

      - name: Build With Gradle
        run: |
          echo "开始进行${{ env.product }}构建"
          chmod +x gradlew
          if [[ "${{ env.product }}" == "app" ]]; then
            ./gradlew assemble${{ env.product }}release -ParmOnly=true --build-cache --no-daemon --max-workers=2 --warning-mode all
            mkdir -p ${{ github.workspace }}/apk/
            bash $GITHUB_WORKSPACE/.github/scripts/collect-apks.sh \
              $GITHUB_WORKSPACE/app/build/outputs/apk \
              $GITHUB_WORKSPACE/apk \
              ${{ env.product }} \
              ${{ env.VERSION }} \
              "" \
              arm
          fi
          ./gradlew assemble${{ env.product }}release --build-cache --no-daemon --max-workers=2 --warning-mode all

      - name: Organize the Files
        run: |
          mkdir -p ${{ github.workspace }}/apk/
          if [[ "${{ env.product }}" == "app" ]]; then
            bash $GITHUB_WORKSPACE/.github/scripts/collect-apks.sh \
              $GITHUB_WORKSPACE/app/build/outputs/apk \
              $GITHUB_WORKSPACE/apk \
              ${{ env.product }} \
              ${{ env.VERSION }} \
              "" \
              universal
          else
            cp -rf ${{ github.workspace }}/app/build/outputs/apk/*/*/*.apk ${{ github.workspace }}/apk/
          fi
          
      - name: Upload App To Artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: legado_${{ env.product }}
          path: ${{ github.workspace }}/apk/*.apk

      - name: Release
        if: ${{ env.product == 'app' }}
        uses: softprops/action-gh-release@v3.0.3
        with:
          name: legado_app_${{ env.VERSION }}
          tag_name: ${{ env.VERSION }}
          body_path: ${{ github.workspace }}/CHANGELOG.md
          draft: false
          prerelease: false
          files: ${{ github.workspace }}/apk/legado_app_*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
