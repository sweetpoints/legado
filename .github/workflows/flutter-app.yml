name: Flutter app contracts

on:
  pull_request:
    paths:
      - 'flutter/apps/**'
      - 'flutter/packages/app_core/**'
      - 'flutter/packages/app_storage/**'
      - 'flutter/packages/app_backup/**'
      - 'flutter/packages/source_*/**'
      - 'flutter/tool/v8/**'
      - 'flutter/tool/merge-app-localizations.py'
      - 'flutter/pubspec.*'
      - 'flutter/docs/app-migration/**'
      - 'flutter/tool/app-migration-inventory.py'
      - 'app/src/main/java/io/legado/app/ui/**'
      - 'app/src/main/java/io/legado/app/data/**'
      - 'app/src/main/java/io/legado/app/service/**'
      - 'modules/**'
      - '.github/workflows/flutter-app.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - uses: actions/cache@v5
        with:
          path: flutter/packages/source_v8/.cache
          key: app-v8-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flutter/tool/v8/**', 'flutter/packages/source_v8/src/**') }}
      - name: Resolve workspace
        working-directory: flutter
        run: flutter pub get
      - name: Check Android migration scope
        run: python3 flutter/tool/app-migration-inventory.py
      - name: Check localized messages
        run: python3 flutter/tool/merge-app-localizations.py --check
      - name: Regenerate application contracts
        working-directory: flutter/apps/legado
        run: |
          bash ../../tool/generate-app.sh
          git diff --exit-code -- lib
      - name: Check formatting
        working-directory: flutter
        run: dart format --output=none --set-exit-if-changed apps/legado/lib apps/legado/test packages/app_core/lib packages/app_core/test
      - name: Verify application data contracts
        working-directory: flutter/packages/app_core
        run: |
          dart analyze
          dart run test:test
      - name: Verify Flutter app interaction and theme contracts
        working-directory: flutter/apps/legado
        run: |
          flutter analyze
          flutter test

  storage-contracts:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-26.04, macos-26, windows-2025]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: flutter
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Verify portable data and archive contracts
        run: |
          for package in app_core app_storage app_backup; do
            (cd "packages/$package" && dart analyze && dart run test:test)
          done

  windows-toolchain-review:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Collect candidate Windows V8 toolchain receipt
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $collector = 'flutter/tool/v8/windows_toolchain_receipt.py'
          $clangRoot = Join-Path $env:RUNNER_TEMP 'legado-reviewed-windows-clang'
          python $collector fetch-clang --output $clangRoot
          if ($LASTEXITCODE -ne 0) { throw 'Fixed Clang download verification failed' }
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $vsRoot = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ([string]::IsNullOrWhiteSpace($vsRoot)) { throw 'No candidate MSVC installation' }
          $versionFile = Join-Path $vsRoot 'VC/Auxiliary/Build/Microsoft.VCToolsVersion.default.txt'
          $msvcVersion = (Get-Content $versionFile -Raw).Trim()
          $msvcRoot = Join-Path $vsRoot "VC/Tools/MSVC/$msvcVersion"
          $sdkRoot = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits/10'
          python $collector collect --target windows-x64 `
            --clang-root $clangRoot --msvc-root $msvcRoot --msvc-version $msvcVersion `
            --msvc-version-file $versionFile --sdk-root $sdkRoot --sdk-version '10.0.26100.0' `
            --image-version "$env:ImageVersion" --source-sha '${{ github.sha }}' `
            --output 'build/windows-v8-toolchain-candidate'
          if ($LASTEXITCODE -ne 0) { throw 'Candidate toolchain receipt failed' }
      - name: Upload candidate Windows toolchain metadata
        uses: actions/upload-artifact@v7.0.1
        with:
          name: windows-v8-toolchain-candidate
          path: build/windows-v8-toolchain-candidate/
          if-no-files-found: error
