name: Flutter app contracts

on:
  pull_request:
    paths:
      - 'flutter/apps/**'
      - 'flutter/packages/app_core/**'
      - 'flutter/packages/app_storage/**'
      - 'flutter/packages/app_backup/**'
      - 'flutter/packages/source_*/**'
      - 'flutter/tool/v8/**'
      - 'flutter/tool/merge-app-localizations.py'
      - 'flutter/tool/apple-native-acceptance.py'
      - 'flutter/tool/test_apple_native_acceptance.py'
      - 'flutter/pubspec.*'
      - 'flutter/docs/app-migration/**'
      - 'flutter/tool/app-migration-inventory.py'
      - 'app/src/main/java/io/legado/app/ui/**'
      - 'app/src/main/java/io/legado/app/data/**'
      - 'app/src/main/java/io/legado/app/service/**'
      - 'modules/**'
      - '.github/workflows/flutter-app.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - uses: actions/cache@v5
        with:
          path: flutter/packages/source_v8/.cache
          key: app-v8-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flutter/tool/v8/**', 'flutter/packages/source_v8/src/**') }}
      - name: Resolve workspace
        working-directory: flutter
        run: flutter pub get
      - name: Authenticate native PDFium before application tests
        run: |
          python3 -m unittest discover -s flutter/tool -p test_verify_pdfium.py
          python3 -m unittest discover -s flutter/tool -p test_apple_native_acceptance.py
          python3 flutter/tool/verify-pdfium.py --prepare-target ${{ runner.arch == 'ARM64' && 'mac-arm64' || 'mac-x64' }}
      - name: Check Android migration scope
        run: python3 flutter/tool/app-migration-inventory.py
      - name: Check localized messages
        run: python3 flutter/tool/merge-app-localizations.py --check
      - name: Regenerate application contracts
        working-directory: flutter/apps/legado
        run: |
          bash ../../tool/generate-app.sh
          git diff --exit-code -- lib
      - name: Check formatting
        working-directory: flutter
        run: dart format --output=none --set-exit-if-changed apps/legado/lib apps/legado/test apps/legado/integration_test packages/app_core/lib packages/app_core/test
      - name: Verify application data contracts
        working-directory: flutter/packages/app_core
        run: |
          dart analyze
          dart run test:test
      - name: Verify Flutter app interaction and theme contracts
        working-directory: flutter/apps/legado
        run: |
          flutter analyze
          flutter test

  storage-contracts:
    strategy:
      fail-fast: false
      matrix:
        # Portable Dart contracts run once during Android migration; manual
        # acceptance also checks the macOS and Windows storage implementations.
        runner: ${{ github.event_name == 'workflow_dispatch' && fromJSON('["ubuntu-26.04", "macos-26", "windows-2025"]') || fromJSON('["ubuntu-26.04"]') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: flutter
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Verify portable data and archive contracts
        run: |
          for package in app_core app_storage app_backup; do
            (cd "packages/$package" && dart analyze && dart run test:test)
          done

  apple-native-app:
    # iOS/macOS application acceptance is manual during Android migration.
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-26
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        platform: [macos, ios]
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/cache@v5
        with:
          path: flutter/packages/source_v8/.cache
          key: app-v8-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flutter/tool/v8/**', 'flutter/packages/source_v8/src/**') }}
      - name: Resolve workspace
        working-directory: flutter
        run: flutter pub get
      - name: Run native application on macOS
        if: matrix.platform == 'macos'
        working-directory: flutter/apps/legado
        run: flutter test integration_test/native_app_test.dart -d macos
      - name: Run native application on ARM64 iOS simulator
        if: matrix.platform == 'ios'
        run: python3 flutter/tool/apple-native-acceptance.py --output build/apple-native-ios
      - name: Preserve iOS simulator phase diagnostics
        if: ${{ always() && matrix.platform == 'ios' }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: apple-native-ios-${{ github.sha }}
          path: build/apple-native-ios/
          if-no-files-found: warn
          retention-days: 14
