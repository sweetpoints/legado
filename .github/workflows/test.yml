name: Test Build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.set-ver.outputs.version }}
      versionL: ${{ steps.set-ver.outputs.versionL }}
    steps:
      - id: set-ver
        run: |
          version="3.$(TZ=Asia/Shanghai date +%y%m%d%H)"
          echo "version=$version" >> $GITHUB_OUTPUT
          echo "versionL=$version" >> $GITHUB_OUTPUT

  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-android
      - name: Run unit tests and full release Lint
        run: ./gradlew :app:testAppReleaseUnitTest :app:lintAppRelease --continue --build-cache --no-daemon --max-workers=2 --stacktrace
      - name: Upload unit-test reports
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: unit-test-reports
          path: |
            **/build/reports/tests/
            **/build/test-results/
            app/build/reports/lint-results-appRelease.*
          if-no-files-found: warn

  build:
    needs: prepare
    strategy:
      matrix:
        product: [app]
        type: [release, releaseA]
        package: [arm, universal]
      fail-fast: false
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      package: ${{ matrix.package }}
      product: ${{ matrix.product }}
      type: ${{ matrix.type }}
      VERSION: ${{ needs.prepare.outputs.version }}
      VERSIONL: ${{ needs.prepare.outputs.versionL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Verify Beta Release Notes
        if: ${{ matrix.type == 'release' && matrix.package == 'arm' }}
        run: bash .github/scripts/test-extract-latest-update.sh

      - name: Verify Help Highlight Bundle
        if: ${{ matrix.type == 'release' && matrix.package == 'arm' }}
        run: node .github/scripts/test-help-highlight.js

      - name: Setup Android build
        uses: ./.github/actions/setup-android

      - name: Verify Cronet Bundle
        if: ${{ matrix.type == 'release' && matrix.package == 'arm' }}
        run: |
          chmod +x .github/scripts/verify-cronet.sh
          .github/scripts/verify-cronet.sh

      - name: Verify APK Collector
        if: ${{ matrix.type == 'release' && matrix.package == 'arm' }}
        run: bash .github/scripts/test-collect-apks.sh

      - name: Verify Web Asset Push
        if: ${{ matrix.type == 'release' && matrix.package == 'arm' }}
        run: bash .github/scripts/test-push-web-assets.sh

      - name: Prepare Assets
        run: |
          echo "清空 18PlusList.txt"
          echo "" > $GITHUB_WORKSPACE/app/src/main/assets/18PlusList.txt

      - name: Release APK Sign
        run: |
          echo "设置签名文件"
          echo "给apk增加签名"
          cp $GITHUB_WORKSPACE/.github/workflows/legado.jks $GITHUB_WORKSPACE/app/legado.jks
          sed '$a\RELEASE_STORE_FILE=./legado.jks'          $GITHUB_WORKSPACE/gradle.properties -i
          sed '$a\RELEASE_KEY_ALIAS=legado'                 $GITHUB_WORKSPACE/gradle.properties -i
          sed '$a\RELEASE_STORE_PASSWORD=gedoor_legado'     $GITHUB_WORKSPACE/gradle.properties -i
          sed '$a\RELEASE_KEY_PASSWORD=gedoor_legado'       $GITHUB_WORKSPACE/gradle.properties -i

      - name: Build With Gradle
        run: |
          set -o pipefail
          build_log="$RUNNER_TEMP/gradle-build.log"
          echo "当前版本号: $VERSION"
          sed -i "s|^val appVersion = .*|val appVersion = \"$VERSION\"|" "$GITHUB_WORKSPACE/app/build.gradle.kts"

          if [ "$type" == "release" ]; then
            typeName="新包名"
          else
            typeName="新共存"
            # 替换 releaseA 相关包名（防止冲突）
            sed -i 's/".release"/".releaseA"/' "$GITHUB_WORKSPACE/app/build.gradle.kts"
            if [ -f "$GITHUB_WORKSPACE/app/google-services.json" ]; then
              sed -i 's/.release/.releaseA/' "$GITHUB_WORKSPACE/app/google-services.json"
            fi
          fi

          chmod +x gradlew
          gradle_args=()
          if [[ "$package" == "arm" ]]; then
            gradle_args+=(-ParmOnly=true -PflutterSourceAbis=arm64-v8a)
          fi
          ./gradlew :app:assembleAppRelease "${gradle_args[@]}" \
            --build-cache --no-daemon --max-workers=2 --warning-mode all --stacktrace \
            2>&1 | tee "$build_log"
          bash .github/scripts/collect-apks.sh \
            app/build/outputs/apk "$GITHUB_WORKSPACE/apk" \
            "$product" "$VERSIONL" "$typeName" "$package"

          echo "移动mapping文件"
          mkdir -p ${{ github.workspace }}/mapping/
          for file in $(find ${{ github.workspace }}/app/build/outputs/mapping -name "mapping.txt"); do
            mv "$file" ${{ github.workspace }}/mapping/mapping.txt
          done

      - name: Check Resolved Gradle Warnings
        run: |
          warning_pattern='Properties should be assigned using|Unable to strip (the following )?librar|error occurred when parsing kotlin metadata|running out of JVM Metaspace'
          if grep -E "$warning_pattern" "$RUNNER_TEMP"/gradle-*.log; then
            echo "Resolved Gradle warning reappeared"
            exit 1
          fi

      - name: Move Missing Rules Files
        run: |
          echo "移动 missing_rules.txt"
          mkdir -p ${{ github.workspace }}/mapping/
          find ${{ github.workspace }}/app/build/outputs/mapping -name "missing_rules.txt" -exec mv {} ${{ github.workspace }}/mapping/missing_rules.txt \; || true

      - name: Upload Missing Rules File
        uses: actions/upload-artifact@v7.0.1
        with:
          name: legado.${{ env.product }}.${{ env.type }}.${{ matrix.package }}.mapping.missing_rules
          if-no-files-found: ignore
          path: ${{ github.workspace }}/mapping/missing_rules.txt

      - name: Check Build Result
        run: |
          expected_packages=("$package")
          mapfile -d '' apks < <(find ${{ github.workspace }}/apk -maxdepth 1 \
            -type f -name 'legado_*.apk' -print0)
          if [[ ${#apks[@]} -ne ${#expected_packages[@]} ]]; then
            echo "Expected ${#expected_packages[@]} APKs, found ${#apks[@]}"
            exit 1
          fi

          declare -A verified=()
          for apk in "${apks[@]}"; do
            file_name=$(basename "$apk")
            case "$file_name" in
              *_universal_*) package_kind=universal ;;
              *) package_kind=arm ;;
            esac
            if [[ -n "${verified[$package_kind]:-}" ]]; then
              echo "Multiple APKs detected for $package_kind"
              exit 1
            fi

            packaged_abis=$(unzip -Z1 "$apk" \
              | sed -n 's#^lib/\([^/]*\)/.*#\1#p' \
              | sort -u \
              | paste -sd ' ' -)
            if [[ "$package_kind" == "universal" ]]; then
              expected_native_abis="arm64-v8a x86_64"
            else
              expected_native_abis="arm64-v8a"
            fi
            if [[ "$packaged_abis" != "$expected_native_abis" ]]; then
              echo "$package_kind APK contains unexpected native ABIs: $packaged_abis"
              exit 1
            fi
            python3 .github/scripts/verify-v8-only.py --apk "$apk"
            verified[$package_kind]=$apk
          done

          for package_kind in "${expected_packages[@]}"; do
            if [[ -z "${verified[$package_kind]:-}" ]]; then
              echo "Missing APK for $package_kind"
              exit 1
            fi
          done

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: legado.${{ env.product }}.${{ env.type }}.${{ matrix.package }}
          if-no-files-found: error
          path: ${{ github.workspace }}/apk/*.apk

      - name: Upload Mapping Artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: legado.${{ env.product }}.${{ env.type }}.${{ matrix.package }}.mapping
          if-no-files-found: ignore
          path: ${{ github.workspace }}/mapping/mapping.txt

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: build-logs-${{ matrix.type }}-${{ matrix.package }}
          path: |
            ${{ runner.temp }}/gradle-*.log
            app/build/reports/lint-results-*.html
          if-no-files-found: warn

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 9.15.9
          run_install: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: modules/web/pnpm-lock.yaml
      - name: Test and build web
        working-directory: modules/web
        run: |
          pnpm install --frozen-lockfile
          pnpm build

  startup:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        api: [26, 36]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup-android
      - name: Build debug APK
        run: ./gradlew :app:assembleAppDebug --build-cache --no-daemon --max-workers=2
      - name: Download the release APK built by this workflow
        uses: actions/download-artifact@v8.0.1
        with:
          name: legado.app.release.universal
          path: app/build/startup-release/
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify debug and release launcher cold starts
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api }}
          emulator-options: -no-window -gpu software -no-snapshot -noaudio -no-boot-anim
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            python3 .github/scripts/test-apk-startup.py app/build/outputs/apk/app/debug/app-app-debug.apk com.legado.app.debug app/build/apk-startup/debug
            python3 .github/scripts/test-apk-startup.py app/build/startup-release/*.apk com.legado.app.release app/build/apk-startup/release
      - name: Upload launcher test evidence
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: apk-startup-api-${{ matrix.api }}
          path: app/build/apk-startup/

  ci:
    name: CI
    needs: [prepare, unit-tests, build, web, startup]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all CI jobs to succeed
        env:
          PREPARE_RESULT: ${{ needs.prepare.result }}
          UNIT_TEST_RESULT: ${{ needs.unit-tests.result }}
          APK_BUILD_RESULT: ${{ needs.build.result }}
          WEB_RESULT: ${{ needs.web.result }}
          STARTUP_RESULT: ${{ needs.startup.result }}
        run: |
          for result in "$PREPARE_RESULT" "$UNIT_TEST_RESULT" "$APK_BUILD_RESULT" "$WEB_RESULT" "$STARTUP_RESULT"; do
            if [[ "$result" != "success" ]]; then
              echo "CI dependency did not succeed: $result"
              exit 1
            fi
          done
