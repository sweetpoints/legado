name: Flutter Windows acceptance
# During progressive Android migration, desktop application acceptance is manual.
# Keep this entry point for full-platform acceptance when migration is complete.
on:
  workflow_dispatch:

permissions:
  contents: read
jobs:
  changes:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      native: ${{ steps.paths.outputs.native }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Select native contracts only for engine and toolchain changes
        id: paths
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          native=true
          if [[ "$EVENT_NAME" != workflow_dispatch && "$BASE_SHA" =~ ^[0-9a-f]{40}$ &&
                ! "$BASE_SHA" =~ ^0+$ ]] && git cat-file -e "${BASE_SHA}^{commit}"; then
            if git diff --quiet "$BASE_SHA" "$HEAD_SHA" -- \
              .github/workflows/flutter-windows-app.yml \
              flutter/tool/v8/ flutter/packages/source_v8/ \
              flutter/packages/source_engine/ flutter/packages/source_conformance/ \
              flutter/packages/source_platform/ flutter/packages/source_legacy/ \
              flutter/packages/source_migration/ 'flutter/pubspec*'; then
              native=false
            else
              result=$?
              if [[ "$result" != 1 ]]; then exit "$result"; fi
            fi
          fi
          echo "native=$native" >> "$GITHUB_OUTPUT"

  windows-application:
    needs: changes
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      # setup-python places this versioned interpreter first on PATH.
      SOURCE_V8_PYTHON: python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - name: Resolve application workspace and native plugins
        shell: pwsh
        working-directory: flutter
        run: flutter pub get
      - name: Authenticate native PDFium before application builds
        shell: pwsh
        run: |
          python flutter/tool/verify-pdfium.py --prepare-target win-x64
          if ($LASTEXITCODE -ne 0) { throw 'Native PDFium authentication failed' }
      - name: Validate native consumer contracts
        if: needs.changes.outputs.native == 'true'
        shell: pwsh
        run: python -m unittest discover -s flutter/tool/v8 -p 'test_windows*.py' -v
      - name: Prepare and authenticate reviewed Windows V8 bridge
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python flutter/tool/v8/windows_ci.py --prepare-dynamic windows-x64 `
            --image-version "$env:ImageVersion" --source-sha '${{ github.sha }}' > build-windows-app-v8.json
          if ($LASTEXITCODE -ne 0) { throw 'Reviewed V8 bridge preparation failed' }
      - name: Execute native FFI probe and require normal process exit
        if: needs.changes.outputs.native == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $receipt = Get-Content build-windows-app-v8.json -Raw | ConvertFrom-Json
          python flutter/tool/v8/windows_sdk.py --verify-runtime $receipt.artifactRoot
          if ($LASTEXITCODE -ne 0) { throw 'Native V8 FFI probe or normal process exit failed' }
      - name: Run real Dart V8 worker transport and source conformance
        if: needs.changes.outputs.native == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force build/windows-v8-acceptance | Out-Null
          Push-Location flutter/packages/source_v8
          dart test test/ --reporter expanded 2>&1 | Tee-Object ../../../build/windows-v8-acceptance/source-v8.log
          if ($LASTEXITCODE -ne 0) { throw 'Windows Dart V8 transport or normal process exit failed' }
          Pop-Location
          Push-Location flutter/packages/source_conformance
          dart test test/ --reporter expanded 2>&1 | Tee-Object ../../../build/windows-v8-acceptance/conformance.log
          if ($LASTEXITCODE -ne 0) { throw 'Windows V8 source conformance or normal process exit failed' }
          Pop-Location
      - name: Run actual Windows application integration
        shell: pwsh
        working-directory: flutter/apps/legado
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force ../../../build/windows-app-acceptance | Out-Null
          flutter test integration_test/native_app_test.dart -d windows --reporter expanded 2>&1 |
            Tee-Object ../../../build/windows-app-acceptance/integration.log
          if ($LASTEXITCODE -ne 0) { throw 'Compiled Windows app integration failed' }
      - name: Build complete Windows Release application bundle
        shell: pwsh
        working-directory: flutter/apps/legado
        run: |
          $ErrorActionPreference = 'Stop'
          flutter build windows --release 2>&1 | Tee-Object ../../../build/windows-app-acceptance/release-build.log
          if ($LASTEXITCODE -ne 0) { throw 'Windows Release build failed' }
      - name: Package app-local Microsoft CRT and test isolated portable Release
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $release = (Resolve-Path flutter/apps/legado/build/windows/x64/runner/Release).Path
          $executable = Join-Path $release 'legado_app.exe'
          if (-not (Test-Path $executable)) { throw 'Release executable missing' }
          if (-not (Test-Path "$release/flutter_windows.dll")) { throw 'Flutter engine DLL missing' }
          if (-not (Test-Path "$release/data/flutter_assets")) { throw 'Flutter assets missing' }
          $bridge = @(Get-ChildItem $release -Recurse -File -Filter source_v8.dll)
          if ($bridge.Count -ne 1) { throw 'Expected exactly one bundled V8 bridge' }
          $bytes = [System.IO.File]::ReadAllBytes($executable)
          $pe = [BitConverter]::ToInt32($bytes, 60)
          if ([BitConverter]::ToUInt16($bytes, $pe + 4) -ne 34404) { throw 'Expected x64 Release executable' }
          $prepared = Get-Content build-windows-app-v8.json -Raw | ConvertFrom-Json
          $nativeManifest = Get-Content "$($prepared.artifactRoot)/manifest.json" -Raw | ConvertFrom-Json
          if ((Get-FileHash $bridge[0].FullName -Algorithm SHA256).Hash.ToLower() -ne $nativeManifest.binary.sha256) { throw 'Bundled V8 bridge differs from reviewed native artifact' }
          & ./flutter/tool/windows/package-portable.ps1 -BundleDirectory $release `
            -OutputDirectory build/windows-portable-release `
            -EvidenceDirectory build/windows-app-acceptance -SourceSha '${{ github.sha }}'
      - name: Preserve native application bundle and test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: legado-windows-x64-release-acceptance
          path: |
            build-windows-app-v8.json
            build/windows-app-acceptance/
          if-no-files-found: warn

      - name: Preserve exact native artifact and acceptance evidence
        if: ${{ always() && needs.changes.outputs.native == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-x64-v8-native-acceptance
          include-hidden-files: true
          path: |
            build-windows-app-v8.json
            build/windows-v8-acceptance/
            flutter/packages/source_v8/.cache/windows-built/
          if-no-files-found: warn

  windows-arm64-cross-link:
    needs: changes
    if: needs.changes.outputs.native == 'true'
    # Both compiler and runner stay x64. Cross-link success is not ARM64 execution.
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Validate reviewed target inventories
        shell: pwsh
        run: python -m unittest discover -s flutter/tool/v8 -p 'test_windows*.py' -v
      - name: Cross-compile ARM64 bridge using reviewed ARM64 CRT and SDK libraries
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python flutter/tool/v8/windows_ci.py --prepare-dynamic windows-arm64 `
            --image-version "$env:ImageVersion" --source-sha '${{ github.sha }}' > build-windows-arm64-receipt.json
          if ($LASTEXITCODE -ne 0) { throw 'Windows x64 to ARM64 bridge cross-link failed' }
          $receipt = Get-Content build-windows-arm64-receipt.json -Raw | ConvertFrom-Json
          $manifest = Get-Content "$($receipt.artifactRoot)/manifest.json" -Raw | ConvertFrom-Json
          if ($manifest.target -ne 'windows-arm64' -or $manifest.inspection.machine -ne 43620) { throw 'Expected PE32+ ARM64 bridge' }
          if ($manifest.validation.runtimeTested) { throw 'Cross-build must not claim ARM64 runtime testing' }
      - name: Preserve exact ARM64 cross-link artifact and evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-arm64-v8-cross-link
          include-hidden-files: true
          path: |
            build-windows-arm64-receipt.json
            flutter/packages/source_v8/.cache/windows-built/
          if-no-files-found: warn
