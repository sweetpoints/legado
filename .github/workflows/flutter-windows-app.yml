name: Flutter Windows application acceptance
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/flutter-windows-app.yml'
      - 'flutter/**'
  push:
    branches: [master]
    paths:
      - '.github/workflows/flutter-windows-app.yml'
      - 'flutter/**'
permissions:
  contents: read
jobs:
  windows-application:
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      # setup-python places this versioned interpreter first on PATH.
      SOURCE_V8_PYTHON: python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - name: Resolve application workspace and native plugins
        shell: pwsh
        working-directory: flutter
        run: flutter pub get
      - name: Authenticate native PDFium before application builds
        shell: pwsh
        run: |
          python flutter/tool/verify-pdfium.py --prepare-target win-x64
          if ($LASTEXITCODE -ne 0) { throw 'Native PDFium authentication failed' }
      - name: Prepare and authenticate reviewed Windows V8 bridge
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python flutter/tool/v8/windows_ci.py --prepare-dynamic windows-x64 `
            --image-version "$env:ImageVersion" --source-sha '${{ github.sha }}' > build-windows-app-v8.json
          if ($LASTEXITCODE -ne 0) { throw 'Reviewed V8 bridge preparation failed' }
      - name: Run actual Windows application integration
        shell: pwsh
        working-directory: flutter/apps/legado
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force ../../../build/windows-app-acceptance | Out-Null
          flutter test integration_test/native_app_test.dart -d windows --reporter expanded 2>&1 |
            Tee-Object ../../../build/windows-app-acceptance/integration.log
          if ($LASTEXITCODE -ne 0) { throw 'Compiled Windows app integration failed' }
      - name: Build complete Windows Release application bundle
        shell: pwsh
        working-directory: flutter/apps/legado
        run: |
          $ErrorActionPreference = 'Stop'
          flutter build windows --release 2>&1 | Tee-Object ../../../build/windows-app-acceptance/release-build.log
          if ($LASTEXITCODE -ne 0) { throw 'Windows Release build failed' }
      - name: Start Release app and require graceful process exit
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $evidence = (Resolve-Path build/windows-app-acceptance).Path
          $release = (Resolve-Path flutter/apps/legado/build/windows/x64/runner/Release).Path
          $executable = Join-Path $release 'legado_app.exe'
          if (-not (Test-Path $executable)) { throw 'Release executable missing' }
          if (-not (Test-Path "$release/flutter_windows.dll")) { throw 'Flutter engine DLL missing from release bundle' }
          if (-not (Test-Path "$release/data/flutter_assets")) { throw 'Flutter asset directory missing from release bundle' }
          $bridge = @(Get-ChildItem $release -Recurse -File -Filter source_v8.dll)
          if ($bridge.Count -ne 1) { throw 'Expected exactly one bundled V8 native bridge' }
          $bytes = [System.IO.File]::ReadAllBytes($executable)
          $pe = [BitConverter]::ToInt32($bytes, 60)
          if ([BitConverter]::ToUInt16($bytes, $pe + 4) -ne 34404) { throw 'Expected x64 Release executable' }
          $prepared = Get-Content build-windows-app-v8.json -Raw | ConvertFrom-Json
          $nativeManifest = Get-Content "$($prepared.artifactRoot)/manifest.json" -Raw | ConvertFrom-Json
          if ((Get-FileHash $bridge[0].FullName -Algorithm SHA256).Hash.ToLower() -ne $nativeManifest.binary.sha256) { throw 'Bundled V8 bridge differs from reviewed native artifact' }
          Compress-Archive -Path "$release/*" -DestinationPath "$evidence/legado-windows-x64-release.zip"
          Get-FileHash "$evidence/legado-windows-x64-release.zip" -Algorithm SHA256 |
            Format-List | Out-File "$evidence/release-bundle-sha256.txt"
          $process = Start-Process $executable -WorkingDirectory $release -PassThru `
            -RedirectStandardOutput "$evidence/release.stdout.log" -RedirectStandardError "$evidence/release.stderr.log"
          try {
            Start-Sleep -Seconds 8
            $process.Refresh()
            if ($process.HasExited) { throw "Release app exited during startup: $($process.ExitCode)" }
            if (-not $process.CloseMainWindow()) { throw 'Release native window did not accept close request' }
            if (-not $process.WaitForExit(15000)) { throw 'Release app did not exit gracefully after closing its window' }
            if ($process.ExitCode -ne 0) { throw "Release app shutdown failed: $($process.ExitCode)" }
            @{
              platform = 'windows-x64'; sourceSha = '${{ github.sha }}'; buildType = 'Release';
              startupProcessStayedAlive = $true; gracefulWindowClose = $true; exitCode = $process.ExitCode;
              executableSha256 = (Get-FileHash $executable -Algorithm SHA256).Hash.ToLower();
              nativeBridgeSha256 = (Get-FileHash $bridge[0].FullName -Algorithm SHA256).Hash.ToLower()
            } | ConvertTo-Json | Set-Content "$evidence/release-startup.json" -Encoding utf8
          } finally {
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
          }
      - name: Preserve native application bundle and test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: legado-windows-x64-release-acceptance
          path: |
            build-windows-app-v8.json
            build/windows-app-acceptance/
          if-no-files-found: warn
