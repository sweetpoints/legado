name: legado_app
description: "Cross-platform Legado reader application."
resolution: workspace
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  app_core:
    path: ../../packages/app_core
  app_backup:
    path: ../../packages/app_backup
  app_storage:
    path: ../../packages/app_storage
  source_engine:
    path: ../../packages/source_engine
  source_legacy:
    path: ../../packages/source_legacy
  source_v8:
    path: ../../packages/source_v8
  flutter_riverpod: ^3.4.3
  freezed_annotation: ^3.1.0
  dio: ^5.11.1
  go_router: ^18.1.0
  material_ui: ^1.7.0
  file_picker: ^13.1.0
  path_provider: ^2.1.6
  crypto: ^3.0.6
  html: ^0.15.6
  xml: ^7.0.1
  intl: ^0.20.3

  flutter_localizations:
    sdk: flutter
dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  freezed: 4.0.1
  build_runner: 2.16.1
  json_serializable: ^6.14.1

flutter:
  generate: true
  uses-material-design: true
